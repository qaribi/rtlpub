name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned development tools
        run: |
          python -m pip install setuptools==84.0.0 build==1.3.0 ruff==0.16.10
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/typecheck" pyright@1.1.414
          python -m pip install --no-build-isolation .
      - name: Test
        run: python -m unittest discover -v
      - name: Lint, format and types
        run: |
          ruff check src tests examples
          ruff format --check src tests examples
          node "$RUNNER_TEMP/typecheck/node_modules/pyright/index.js"
      - name: Build and installed CLI smoke
        run: |
          python -m build --no-isolation
          rtlpub --version
          rtlpub check examples/persian.xhtml --format json --fail-on warning
          python examples/make_epub.py "$RUNNER_TEMP/sample.epub"
          rtlpub check "$RUNNER_TEMP/sample.epub" --format json --fail-on warning
